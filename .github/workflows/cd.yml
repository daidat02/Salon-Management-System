name: CD - Build & Deploy

on:
  # Chỉ deploy sau khi workflow CI chạy thành công trên nhánh main
  # (push code -> CI pass -> CD mới build & deploy).
  workflow_run:
    workflows: ['CI - Test & Verify']
    types: [completed]
    branches:
      - main

  workflow_dispatch:
    inputs:
      target_service:
        description: 'Chọn service cần deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - server
          - client
      run_migrations:
        description: 'Chạy database migration trước khi restart server?'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ${{ github.repository_owner }}/salon-server
  CLIENT_IMAGE: ${{ github.repository_owner }}/salon-client

jobs:
  # ==========================================
  # JOB 1: Build & Push Go Backend Image
  # ==========================================
  build-server:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.target_service == 'all' || inputs.target_service == 'server'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Build & Push Next.js Frontend Image
  # ==========================================
  build-client:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.target_service == 'all' || inputs.target_service == 'client'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3: Copy Compose & Deploy lên AWS EC2
  # ==========================================
  deploy:
    needs: [build-server, build-client]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn để lấy file Compose
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Đẩy file docker-compose.prod.yml mới nhất sang EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml'
          target: '/opt/salon-app'

      - name: Đẩy cấu hình Nginx template mới nhất sang EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'nginx'
          target: '/opt/salon-app'

      - name: Pull image, chạy migration và khởi động lại container trên EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/salon-app

            # Đăng nhập GHCR trên EC2 (dùng chung token tự động của GitHub Actions)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Ghi toàn bộ nội dung từ GitHub Secret ra file .env.prod
            cat << 'EOF' > /opt/salon-app/.env.prod
            ${{ secrets.ENV_PROD }}
            EOF
            chmod 600 /opt/salon-app/.env.prod

            # Nạp các biến môi trường từ file .env.prod vào shell hiện tại
            set -a
            source .env.prod
            set +a

            # Tải image mới nhất về
            docker compose -f docker-compose.prod.yml pull

            # Đảm bảo PostgreSQL đã bật và khỏe mạnh trước khi chạy migration
            docker compose -f docker-compose.prod.yml up -d postgres

            # Chạy migration nếu được bật (mặc định true khi push code)
            if [ "${{ inputs.run_migrations || 'true' }}" = "true" ]; then
              echo "Đang chạy database migrations..."
              docker compose -f docker-compose.prod.yml run --rm --no-deps migrate
            fi

            # Khởi động lại toàn bộ ứng dụng với image mới
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Chỉ khởi động lại Nginx (không cần recreate các container khác) để load config mới
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx

            # Xóa các image cũ không còn dùng để giải phóng ổ cứng EC2
            docker image prune -f
