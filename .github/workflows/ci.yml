name: CI - Test & Verify

on:
  push:
    branches:
      - dev
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Playwright suite (all | e2e/smoke)'
        required: false
        default: 'all'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DB_URL: postgres://postgres:postgres@localhost:5432/salon_db?sslmode=disable
  E2E_DB_URL: postgres://postgres:postgres@localhost:5432/salon_db?sslmode=disable
  E2E_BASE_URL: http://app.localhost:3000
  E2E_API_ORIGIN: http://localhost:8080
  E2E_OWNER_PHONE: '0900000001'
  E2E_OWNER_PASSWORD: 'E2ePassw0rd!'
  E2E_MANAGER_PHONE: '0900000002'
  E2E_MANAGER_PASSWORD: 'E2ePassw0rd!'
  E2E_RECEPTIONIST_PHONE: '0900000003'
  E2E_RECEPTIONIST_PASSWORD: 'E2ePassw0rd!'
  E2E_ORG_SLUG: e2e-ci-${{ github.run_id }}
  NEXT_PUBLIC_API_URL: /api
  NEXT_PUBLIC_API_VERSION: v1

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: Run usecase tests
        working-directory: server
        run: go test -count=1 ./internal/usecase/...

  client-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: ESLint
        working-directory: client
        run: npm run lint

  playwright:
    needs: [backend-test, client-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Migrate database
        working-directory: server
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          "$(go env GOPATH)/bin/migrate" -path migrations -database "$DB_URL" up

      - name: Start backend
        working-directory: server
        run: |
          cat << 'EOF' > .env
          APP_ENV=test
          PORT=8080
          GIN_MODE=release
          API_BASE_PATH=/api/v1
          SERVER_URL=http://localhost:8080
          CORS_ALLOWED_ORIGINS=http://app.localhost:3000,http://localhost:3000
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=salon_db
          DB_HOST=localhost
          DB_PORT=5432
          DB_URL=postgres://postgres:postgres@localhost:5432/salon_db?sslmode=disable
          JWT_SECRET=e2e-only-secret-change-me-32-chars-min
          ACCESS_TOKEN_EXPIRE=60m
          REFRESH_TOKEN_EXPIRE=168h
          R2_ACCOUNT_ID=dummy-account-id
          R2_ACCESS_KEY_ID=dummy-access-key
          R2_ACCESS_KEY_SECRET=dummy-secret-key
          R2_BUCKET_NAME=salon-test
          R2_PUBLIC_URL=https://example.r2.dev
          EOF

          go build -o /tmp/salon-server ./cmd
          nohup /tmp/salon-server > /tmp/salon-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Backend không khởi động được:'; cat /tmp/salon-server.log; exit 1

      - name: Provision E2E accounts & set .env.e2e
        working-directory: client
        run: |
          echo "127.0.0.1 app.localhost" | sudo tee -a /etc/hosts
          bash e2e/support/provision.sh | tee /tmp/provision.out
          grep "^export " /tmp/provision.out | sed 's/^export //' | tee .env.e2e >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run smoke (PR & dev push)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        working-directory: client
        run: npm run test:e2e:smoke

      - name: Run full suite (nightly / manual)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'all')
        working-directory: client
        run: npm run test:e2e

      - name: Run smoke (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'e2e/smoke'
        working-directory: client
        run: npm run test:e2e:smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: cat /tmp/salon-server.log
